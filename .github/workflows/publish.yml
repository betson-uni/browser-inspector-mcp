name: Publish to npm

# Publishes only when a version tag (e.g. v3.0.1) is pushed — not on every
# push to main. Cut a release with:
#   npm version patch|minor|major   # bumps package.json + creates the tag
#   git push && git push --tags
#
# NOTE: secrets.NPM_TOKEN must be a token that can publish WITHOUT an interactive
# OTP. With account 2FA set to "Authorization and writes", a normal/granular
# token is rejected (npm masks this as a 404 on publish). For unattended CI
# publishing, either set 2FA to "Authorization only" or use a token that
# bypasses 2FA — otherwise publish manually with `npm publish --otp=<code>`.
on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Publish
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
